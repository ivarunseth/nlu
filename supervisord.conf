; Single-container deployment: every process the platform is made of, under
; one supervisord. This is the image's default CMD (docker/Dockerfile).
; docker-compose.yml does NOT use it — there each service overrides
; `command` and runs exactly one of these processes per container.
;
; All programs read the same .env / container environment. FLASK_ENV is
; forced per program where it matters: it names the environment a data
; plane or serving worker belongs to (and the port a server listens on).
; Logs go to the container's stdout/stderr so `docker logs` shows them.

[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/app/supervisord.pid

; Lets `supervisorctl status` / `restart <program>` work inside the
; container: docker exec <container> supervisorctl -c /etc/supervisor/conf.d/supervisord.conf status
[unix_http_server]
file=/app/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///app/supervisor.sock

; Control plane: API + Socket.IO on :5001. Applies migrations first so a
; fresh database is schema-complete before anything writes to it; the
; workers and data planes never touch the database before a request or
; task arrives, so they may start alongside.
[program:app]
command=sh -c "flask db upgrade && exec python app.py"
environment=FLASK_ENV="testing"
user=appuser
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Data planes: one per environment, each serving its own registry.
[program:triton_testing]
command=python app.py triton
environment=FLASK_ENV="testing"
user=appuser
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:triton_production]
command=python app.py triton
environment=FLASK_ENV="production"
user=appuser
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Training worker. Prefork with worker_max_tasks_per_child=1 gives every
; run a fresh process; -c 1 keeps one host from oversubscribing itself.
[program:sage]
command=celery -A server.tasks:sage worker -E -Q training -P prefork -c 1 -l INFO -Ofair -n sage@%%h
environment=FLASK_ENV="testing"
user=appuser
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

; Serving workers: one per environment queue.
[program:worker_testing]
command=celery -A server.tasks:triton worker -E -Q testing -P prefork -l INFO -Ofair -n triton-testing@%%h
environment=FLASK_ENV="testing"
user=appuser
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:worker_production]
command=celery -A server.tasks:triton worker -E -Q production -P prefork -l INFO -Ofair -n triton-production@%%h
environment=FLASK_ENV="production"
user=appuser
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
