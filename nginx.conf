# Mirrors the Vite dev proxy (vite.config.js): the SPA is static, /api and
# /socket.io go to the control plane. Inference is NOT proxied here — each
# deployment's endpoint is an absolute URL on its own data plane
# (INFERENCE_HOST:5002 / :5004), which the browser calls directly.

server {
    listen 80;
    server_name _;

    # Resolve the control plane through Docker's embedded DNS at request
    # time (a variable in proxy_pass forces that), so nginx starts and stays
    # up whether or not `api` is running or has been recreated.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:5001;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;

    # Compress text responses on the way out — the JSON dataset document of a
    # 25k-utterance model is ~2 MB raw and ~10× smaller gzipped. The JS/CSS
    # bundles benefit the same way. (Off for tiny bodies, where it costs
    # more than it saves.)
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml;

    location /api/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Dataset import/export and training kick-offs can be slow.
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
    }

    # Hashed assets are immutable; everything else falls through to the SPA.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
